repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--config, pyproject.toml, --fix]
        files: ^(src|tests)/.*\.py$

  - repo: https://github.com/pylint-dev/pylint
    rev: v4.1.3
    hooks:
      - id: pylint
        args: [--rcfile, pyproject.toml]
        files: ^(src|tests)/.*\.py$
        additional_dependencies:
          [
            compact-json,
            protobuf,
            python-snappy,
            sigfig,
            setuptools,
            importlib-resources,
            enum-tools,
            python-dateutil,
            security,
            cryptography,
          ]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        args: [--config-file, pyproject.toml]
        files: ^(src|tests)/.*\.py$
        additional_dependencies:
          [
            compact-json,
            protobuf,
            python-snappy,
            sigfig,
            setuptools,
            importlib-resources,
            enum-tools,
            python-dateutil,
            security,
            cryptography,
          ]
