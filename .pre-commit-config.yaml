repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        entry: uv run --active ruff check
        args: [--config, pyproject.toml, --fix]
        files: ^src/(numbers_parser|build)/.*\.py$
        exclude: ^(src/numbers_parser/generated/.*\.py|src/build/protodump\.py)$

  - repo: https://github.com/pylint-dev/pylint
    rev: v4.1.3
    hooks:
      - id: pylint
        entry: uv run --active pylint
        args: [--rcfile, pyproject.toml]
        files: ^src/(numbers_parser|build)/.*\.py$
        exclude: ^(src/numbers_parser/generated/.*\.py|src/build/protodump\.py)$
        additional_dependencies:
          [
            compact-json,
            protobuf,
            python-snappy,
            sigfig,
            setuptools,
            importlib-resources,
            enum-tools,
            python-dateutil,
            security,
            cryptography,
            pymupdf,
            pillow,
            pixelmatch,
            rich,
            tqdm,
          ]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        entry: uv run --active mypy
        args: [--config-file, pyproject.toml]
        files: ^src/numbers_parser/[^/]+\.py$