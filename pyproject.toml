[project]
authors = [
    {name = "Jon Connell", email = "python@figsandfudge.com"},
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "compact-json>=1.1.3",
    "protobuf>=7.36.0",
    "python-snappy>=0.7",
    "sigfig>=1.3.3",
    "setuptools>=70.0.0",
    "importlib-resources>=6.1",
    "enum-tools>=0.11",
    "python-dateutil>=4.0.0",
    "security>=1.3.1",
    "cryptography>=50.0.1",
]
classifiers = [
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
description = "Read and write Apple Numbers spreadsheets"
name = "numbers-parser"
readme = "README.md"
version = "4.22.2"

[project.urls]
repository = "https://github.com/masaccio/numbers-parser"
documentation = "https://github.com/masaccio/numbers-parser/blob/main/README.md"

[project.scripts]
cat-numbers = "numbers_parser._cat_numbers:main"
unpack-numbers = "numbers_parser._unpack_numbers:main"
csv2numbers = "numbers_parser._csv2numbers:main"

[dependency-groups]
dev = [
    "mock>=5.1.0",
    "pytest>=7.2.0",
    "pytest-check>=1.0",
    "pytest-console-scripts<2.0.0,>=1.3.1",
    "pytest-cov>=4.0,>=5.0",
    "pytest-xdist<4.0.0,>=3.3.1",
    "ruff",
    "tox<5.0.0,>=4.11.4",
    "python-magic>=0.4",
    "colorama<1.0.0,>=0.4.6",
    "pympler<2.0,>=1.1",
    "pre-commit>=4.6.2",
    "pylint>=4.1.3",
    "mypy>=2.4.1",
    "types-protobuf>=7.35.1.20260906",
]
docs = [
    "sphinx<9.0,>=7.3",
    "enum-tools>=0.11",
    "sphinx-toolbox>=3.5",
    "sphinx-nefertiti>=0.7",
    "sphinx-markdown-builder>=0.6",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-mermaid>=2.1.1",
    # Security updates
    "urllib3>=2.7.0",
    "filelock>=3.20.1",
    "docutils>=0.21.2",
    "pandas>=2.3.3",
]
profile = [
    "gprof2dot>=2022.7.29,<2026.0.0",
    "line-profiler>=5.0.0",
    "pytest-profiling",
]
bootstrap = [
    "tqdm>=4.66",
    "rich>=14.0",
    "pyobjc-core>=12.0",
    "pyobjc-framework-Cocoa>=10.2",
    "py2app>=0.28",
    "mypy-protobuf>=5.1.0",
]
visualcheck = [
    "osascript>=0.0.27",
    "pillow>=13.0.0",
    "pixelmatch>=0.4.0",
    "pymupdf>=1.28.2",
    "rich>=15.0.0",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["numbers_parser*"]
exclude = ["*tests*", "numbers_parser.data"]
namespaces = false  # disable scanning PEP 420 namespaces

[tool.setuptools.package-data]
"numbers_parser" = ["data/*"]

[tool.coverage.run]
branch = true
omit = ["src/numbers_parser/generated/*.py"]

[tool.coverage.html]
directory = "coverage_html_report"
show_contexts = false

[tool.coverage.report]
exclude_lines = [
  "overload",
  "pragma: no cover",
  "raise NotImplementedError",
  "TYPE_CHECKING",
]

[tool.pytest.ini_options]
addopts = "--cov=src/numbers_parser --cov-report=html --cov-report=term-missing:skip-covered"

[tool.tox]
requires = ["tox>=4.0"]
env_list = ["py311", "py312", "py313", "py314", "py315"]

[tool.tox.env_run_base]
deps = [
  "pytest",
  "pytest-check",
  "pytest-console-scripts",
  "pytest-cov",
  "pytest-xdist",
  "python-magic",
  "pympler",
  "colorama"
]
commands = [
  ["pytest", "tests/", "--import-mode", "importlib", "-n", "logical", "--no-cov"]
]

[tool.isort]
profile = "black"

[tool.ruff]
exclude = [
  # Machine-generated files
  "**/.bootstrap/*",
  "**/.tox/*",
  "**/.vscode/*",
  "**/src/numbers_parser/generated/*",
  # Third-party files not to lint
  "**/src/debug/lldbutil.py",
  "**/src/build/protodump.py",
]
fix = true
lint.select = [ "ALL" ]
lint.ignore = [
  "CPY001",   # Missing copyright notice at top of file
  "FIX002",   # Line contains TODO
  "FBT001",   # Boolean-typed positional argument in function definition
  "FBT002",   # Boolean default positional argument in function definition
  "PTH103",   # os.makedirs() should be replaced by Path.mkdir(parents=True)
  "PTH118",   # os.path.join() should be replaced by Path.joinpath()
  "PTH118",   # os.path.join() should be replaced by Path with / operator
  "PTH119",   # os.path.basename() should be replaced by Path.name
  "PTH123",   # open() should be replaced by Path.open()
  "PLR0913",  # Too many arguments in function definition
  "SIM115",   # Use a context manager for opening files
  "TD002",    # Missing author in TODO
  "TD003",    # Missing issue link for this TODO
  # Conflicts with other rules
  "D212",     # Multiline summary first line
  "D203",     # Blank lines before class docstrings
  "D416",     # Colon after after section titles
]
lint.unfixable = [
  "ERA", # do not autoremove commented out code
]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint.pylint]
extend-allow-magic-values = [2, 3]
max-statements = 100
max-branches = 20

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"src/build/**" = ["PLR2004", "INP001", "PTH"]
"src/debug/**" = [
  "T201",     # print() allowed in debug scripts
  "SLF001",   # Debug internal data
  "INP001",
  ]
"tests/**" = [
  "PLR2004",  # Allow checking for specific numbers
  "S101",     # Allow assert in tests
  "SLF001",   # Tests need to access internal data for coverage
  ]

[tool.pylint."messages control"]
disable = [
  # Pylint cannot infer dynamic protobuf fields or internal model relationships.
  "attribute-defined-outside-init",
  "no-member",
  "no-name-in-module",
  "protected-access",
  "too-many-lines",
  # These checks duplicate Ruff or flag established implementation patterns.
  "duplicate-code",
  "fixme",
  "redefined-builtin",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-boolean-expressions",
  "too-many-branches",
  "too-many-instance-attributes",
  "too-many-locals",
  "too-many-nested-blocks",
  "too-many-positional-arguments",
  "too-many-public-methods",
  "too-many-return-statements",
  "too-many-statements",
]

[tool.pylint.main]
ignored-modules = ["Cocoa", "lldb"]

[tool.mypy]
exclude = [
    "src/numbers_parser/generated/",
    "src/debug/lldbutil.py",
]

[[tool.mypy.overrides]]
module = [
  "snappy",
  "compact_json",
  "sigfig",
]
ignore_missing_imports = true